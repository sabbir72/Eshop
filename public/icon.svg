<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6"/>

  <!-- Shopping Bag Main Body -->
  <g filter="url(#shadow)">
    <!-- Bag handles -->
    <path d="M196 180 V144 C196 110.86 222.86 84 256 84 C289.14 84 316 110.86 316 144 V180" 
          fill="none" stroke="url(#bagGrad)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Bag base -->
    <path d="M140 180 L164 400 C166.5 422 185 438 207 438 H305 C327 438 345.5 422 348 400 L372 180 Z" 
          fill="url(#bagGrad)"/>
    
    <!-- AI Spark / Thunderbolt inside bag -->
    <path d="M268 204 L212 304 H260 L244 408 L312 292 H264 Z" 
          fill="url(#sparkGrad)"/>
  </g>

  <!-- Android Robot Antenna Accent -->
  <circle cx="360" cy="140" r="14" fill="#10b981"/>
  <circle cx="360" cy="140" r="8" fill="#ffffff"/>
</svg>
